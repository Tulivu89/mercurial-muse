name: Site

on:
  push:
    branches: [main, 'claude/**']
    paths: ['adventure/**', 'core/**', 'content/**', 'kit/**', 'studio/**', 'chat/**', 'overview/**', 'package.json', 'package-lock.json', '.github/workflows/site.yml']
  pull_request:
    branches: [main]
    paths: ['adventure/**', 'core/**', 'content/**', 'kit/**', 'studio/**', 'chat/**', 'overview/**', 'package.json', 'package-lock.json', '.github/workflows/site.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Serve the production build and check the Overview, the adventure, the Studio and Chat answer
        working-directory: adventure
        run: |
          NODE_ENV=production PORT=8791 node dist-server/adventure/server/index.js &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8791/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8791/ | tee /tmp/index.html | grep -q 'id="root"'
          script=$(grep -o 'src="/assets/[^"]*\.js"' /tmp/index.html | head -1 | cut -d'"' -f2)
          test -n "$script"
          curl -fsS -o /dev/null -w '%{content_type}\n' "http://127.0.0.1:8791$script" | grep -q javascript
          curl -fsS http://127.0.0.1:8791/settings | grep -q "$script"
          curl -fsS http://127.0.0.1:8791/adventure/ | tee /tmp/adventure.html | grep -q 'id="root"'
          adventure=$(grep -o 'src="/adventure/assets/[^"]*\.js"' /tmp/adventure.html | head -1 | cut -d'"' -f2)
          test -n "$adventure"
          curl -fsS -o /dev/null -w '%{content_type}\n' "http://127.0.0.1:8791$adventure" | grep -q javascript
          test "$(curl -s -o /dev/null -w '%{redirect_url}' 'http://127.0.0.1:8791/?save=s1')" = "http://127.0.0.1:8791/adventure/?save=s1"
          curl -fsS http://127.0.0.1:8791/studio/ | tee /tmp/studio.html | grep -q 'id="root"'
          studio=$(grep -o 'src="/studio/assets/[^"]*\.js"' /tmp/studio.html | head -1 | cut -d'"' -f2)
          test -n "$studio"
          curl -fsS -o /dev/null -w '%{content_type}\n' "http://127.0.0.1:8791$studio" | grep -q javascript
          curl -fsS http://127.0.0.1:8791/chat/ | tee /tmp/chat.html | grep -q 'id="root"'
          chat=$(grep -o 'src="/chat/assets/[^"]*\.js"' /tmp/chat.html | head -1 | cut -d'"' -f2)
          test -n "$chat"
          curl -fsS -o /dev/null -w '%{content_type}\n' "http://127.0.0.1:8791$chat" | grep -q javascript
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8791/overview/)" = "301"

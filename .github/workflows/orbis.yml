name: Orbis

on:
  push:
    branches: [main, 'claude/**']
    paths: ['orbis/**', '.github/workflows/orbis.yml']
  pull_request:
    branches: [main]
    paths: ['orbis/**', '.github/workflows/orbis.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_ORBIS_API_URL: /api
    defaults:
      run:
        working-directory: orbis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: orbis/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

name: Ember

on:
  push:
    branches: [main, 'claude/**']
    paths: ['ember/**', '.github/workflows/ember.yml']
  pull_request:
    branches: [main]
    paths: ['ember/**', '.github/workflows/ember.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ember
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test

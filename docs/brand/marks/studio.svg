<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- True Nib Boundary Clip -->
    <clipPath id="nibBoundary">
      <path d="
        M 250 20
        C 234 20 222 32 222 48
        C 222 62 228 70 234 76
        C 232 82 228 88 224 96
        C 200 145 100 225 100 320
        A 150 150 0 0 0 400 320
        C 400 225 300 145 276 96
        C 272 88 268 82 266 76
        C 272 70 278 62 278 48
        C 278 32 266 20 250 20 Z
      "/>
    </clipPath>

    <!-- Alpha Mask: Cuts out the Slit and Eye as true transparent negative space -->
    <mask id="nibAlphaMask" maskUnits="userSpaceOnUse" x="0" y="0" width="500" height="500">
      <!-- Reveal base -->
      <rect width="500" height="500" fill="#FFFFFF"/>
      
      <!-- Cutout: Center Pen Slit (Cuts cleanly through the top dome down to the eye) -->
      <line x1="250" y1="10" x2="250" y2="305" stroke="#000000" stroke-width="11" stroke-linecap="butt"/>

      <!-- Cutout: Dragon Eye Socket -->
      <path d="
        M 190 325 
        C 214 290 286 290 310 325 
        C 286 360 214 360 190 325 Z
      " fill="#000000"/>

      <!-- Preserve: Solid Ink Dragon Pupil -->
      <path d="
        M 250 301
        C 259 313 260.5 337 250 349
        C 239.5 337 241 313 250 301 Z
      " fill="#FFFFFF"/>
    </mask>

    <!-- Wet Lacquer Shading -->
    <radialGradient id="nibBodyGrad" cx="38%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#383430"/>
      <stop offset="28%" stop-color="#1c1a18"/>
      <stop offset="65%" stop-color="#080706"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Specular Highlights -->
    <linearGradient id="softGloss" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sharpGloss" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Ground Drop Shadow -->
  <ellipse cx="250" cy="476" rx="105" ry="14" fill="#000000" opacity="0.22"/>

  <!-- ================= MASKED INK BODY & SHINE ================= -->
  <!-- Everything inside this group has the slit and eye cut out as pure transparency -->
  <g mask="url(#nibAlphaMask)">
    <!-- Base Nib Silhouette -->
    <path d="
      M 250 20
      C 234 20 222 32 222 48
      C 222 62 228 70 234 76
      C 232 82 228 88 224 96
      C 200 145 100 225 100 320
      A 150 150 0 0 0 400 320
      C 400 225 300 145 276 96
      C 272 88 268 82 266 76
      C 272 70 278 62 278 48
      C 278 32 266 20 250 20 Z
    " fill="url(#nibBodyGrad)"/>

    <!-- Shine Layers (Clipped to Nib Silhouette) -->
    <g clip-path="url(#nibBoundary)">
      <!-- Bottom-Right Meniscus Rim Reflection -->
      <path d="M 374 265 A 142 142 0 0 1 285 456" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="5" 
            stroke-linecap="round" 
            opacity="0.25"/>

      <!-- Soft Gloss Spread -->
      <path d="
        M 234 98
        C 190 155 120 228 120 324
        C 120 330 108 330 108 322
        C 108 216 182 140 226 92
        C 230 87 236 92 234 98 Z
      " fill="url(#softGloss)"/>

      <!-- Crisp Specular Ribbon -->
      <path d="
        M 228 106
        C 188 160 128 230 128 318
        C 128 323 120 323 120 316
        C 120 220 182 148 222 100
        C 225 96 230 100 228 106 Z
      " fill="url(#sharpGloss)"/>

      <!-- Specular Bead Glint -->
      <ellipse cx="222" cy="122" rx="4" ry="9" transform="rotate(-28 222 122)" fill="#FFFFFF" opacity="0.9"/>
    </g>
  </g>
</svg>
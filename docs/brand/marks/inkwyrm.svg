<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- True Droplet Boundary Clip -->
    <clipPath id="dropBoundary">
      <path d="
        M 250 28
        C 244 80 100 210 100 320
        A 150 150 0 0 0 400 320
        C 400 210 256 80 250 28 Z
      "/>
    </clipPath>

    <!-- Alpha Mask: Cuts out the Reticle and Eye as true transparent negative space -->
    <mask id="dropAlphaMask" maskUnits="userSpaceOnUse" x="0" y="0" width="500" height="500">
      <rect width="500" height="500" fill="#FFFFFF"/>
      
      <!-- Cutouts: Chevrons & Brackets (10px wide) -->
      <g stroke="#000000" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M 223 280 L 250 253 L 277 280"/>
        <path d="M 223 370 L 250 397 L 277 370"/>
        <path d="M 205 280 H 178 V 307"/>
        <path d="M 295 280 H 322 V 307"/>
        <path d="M 205 370 H 178 V 343"/>
        <path d="M 295 370 H 322 V 343"/>
      </g>

      <!-- Cutout: Eye Socket -->
      <path d="
        M 190 325 
        C 214 290 286 290 310 325 
        C 286 360 214 360 190 325 Z
      " fill="#000000"/>

      <!-- Preserve: Solid Ink Dragon Pupil -->
      <path d="
        M 250 301
        C 259 313 260.5 337 250 349
        C 239.5 337 241 313 250 301 Z
      " fill="#FFFFFF"/>
    </mask>

    <radialGradient id="inkBody" cx="38%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#383430"/>
      <stop offset="28%" stop-color="#1c1a18"/>
      <stop offset="65%" stop-color="#080706"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <linearGradient id="softGlossDrop" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sharpGlossDrop" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <ellipse cx="250" cy="476" rx="105" ry="14" fill="#000000" opacity="0.22"/>

  <!-- ================= MASKED INK BODY & SHINE ================= -->
  <g mask="url(#dropAlphaMask)">
    <!-- Base Droplet Silhouette -->
    <path d="
      M 250 28
      C 244 80 100 210 100 320
      A 150 150 0 0 0 400 320
      C 400 210 256 80 250 28 Z
    " fill="url(#inkBody)"/>

    <!-- Shine Layers (Clipped to Droplet Silhouette) -->
    <g clip-path="url(#dropBoundary)">
      <path d="M 374 265 A 142 142 0 0 1 285 456" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="5" 
            stroke-linecap="round" 
            opacity="0.25"/>

      <path d="
        M 238 82
        C 190 150 120 226 120 324
        C 120 330 108 330 108 322
        C 108 216 182 138 230 76
        C 234 71 240 76 238 82 Z
      " fill="url(#softGlossDrop)"/>

      <path d="
        M 232 90
        C 188 156 128 228 128 318
        C 128 323 120 323 120 316
        C 120 220 182 146 226 84
        C 229 80 234 84 232 90 Z
      " fill="url(#sharpGlossDrop)"/>

      <ellipse cx="224" cy="116" rx="4" ry="9" transform="rotate(-28 224 116)" fill="#FFFFFF" opacity="0.9"/>
    </g>
  </g>
</svg>
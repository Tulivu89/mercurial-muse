<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12151A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Inkwyrm: Adventure</title>
    <script>
      // Paper by day, ink by night (one choice for the site, kept under inkwyrm.theme). Set before
      // anything is drawn, so a night reader never gets a flash of paper.
      (function () {
        try {
          var chosen = localStorage.getItem('inkwyrm.theme');
          var night = chosen === 'night' || (chosen !== 'paper' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = night ? 'night' : 'paper';
          document.documentElement.style.background = night ? '#12151A' : '#F3EEE4';
        } catch (error) { /* the stylesheet's own default stands */ }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <p id="boot" style="font:16px/1.5 system-ui,sans-serif;color:#8a8273;padding:24px">Loading Inkwyrm…</p>
    </div>
    <script>
      // If the app fails before it can draw, say why instead of showing a blank page.
      window.addEventListener('error', function (event) {
        var boot = document.getElementById('boot');
        if (!boot) return;
        boot.style.color = '#C8553F';
        boot.textContent = 'Inkwyrm could not start: ' + (event.message || 'a script failed to load') + (event.filename ? ' (' + event.filename + ')' : '');
      }, true);
      setTimeout(function () {
        var boot = document.getElementById('boot');
        if (boot && boot.textContent === 'Loading Inkwyrm…') boot.textContent = 'Inkwyrm is taking a long time to start. If this stays, the app script did not load.';
      }, 10000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
